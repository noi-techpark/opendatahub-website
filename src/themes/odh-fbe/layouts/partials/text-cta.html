{{"<!-- Double Column Text - Imgs -->" | safeHTML }}
<section {{ if (isset . "identifier") }} id="{{.identifier}}" {{end}}>
	<div class="container">
		<div class="row gy-4 justify-content-between align-items-center py-4">
			<div class="col-12 m-lg-0">
				<h2>{{ .title | markdownify }}</h2>
				<p>{{ .description | markdownify }}</p>
				
				{{ range .buttons }}
        			<a class="btn btn-primary" {{ if .target_blank }}target="_blank"{{ end }} href="{{ .btn_link }}">{{ .btn_label | markdownify }}</a>
      			{{ end }}

			</div>
		</div>
	</div>
</section>
{{"<!-- /Double Column Text - Icon -->" | safeHTML }}
