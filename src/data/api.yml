apis:
  - title: "Content API"
    description: "Access swagger interface to browse data and learn ow to use the Open Data Hub Tourism API."
    category: "general"
    buttons:
      - label: "Swagger"
        url: "https://tourism.api.opendatahub.com/swagger/index.html"
      - label: "Repository"
        url: "https://github.com/noi-techpark/odh-api-core"
      - label: "Documentation"
        url: "https://github.com/noi-techpark/odh-docs/wiki/Content-API"

  - title: "Time Series API"
    description: "Access swagger interface to browse data and learn ow to use the Open Data Hub Mobility API."
    category: "general"
    buttons:
      - label: "Swagger"
        url: "https://swagger.opendatahub.com/?url=https://mobility.api.opendatahub.com/v2/apispec#/"
      - label: "Repository"
        url: "https://github.com/noi-techpark/it.bz.opendatahub.api.mobility-ninja"
      - label: "Documentation"
        url: "https://github.com/noi-techpark/it.bz.opendatahub.api.mobility-ninja#usage-of-the-api"

  - title: "Transmodel API – NeTEx"
    description: "Access planned mobility data in the European standard NeTEx format (including public transport)."
    category: "project_specific"
    buttons:
      - label: "Swagger"
        url: "https://swagger.opendatahub.com/?url=https://transmodel.api.opendatahub.com/apispec#/netex"
      - label: "Repository"
        url: "https://github.com/noi-techpark/transmodel-api"
      - label: "Documentation"
        url: "https://github.com/noi-techpark/odh-docs/wiki/Transmodel-API-%E2%80%90-NeTEx-Endpoints"

  - title: "Transmodel API – SIRI-Lite"
    description: "Retrive real-time data for parking and sharing services using the SIRI-Lite protocol."
    category: "project_specific"
    buttons:
      - label: "Swagger"
        url: "https://swagger.opendatahub.com/?url=https://transmodel.api.opendatahub.com/apispec#/siri-lite"
      - label: "Repository"
        url: "https://github.com/noi-techpark/transmodel-api"
      - label: "Documentation"
        url: "https://github.com/noi-techpark/odh-docs/wiki/Transmodel-API-%E2%80%90-SIRI%E2%80%90Lite-Endpoints"

  - title: "AlpineBits HotelData"
    description: "Access accommodation inventory data via the Open Data Hub AlpineBits HotelData API."
    category: "project_specific"
    buttons:
      - label: "Repository"
        url: "https://github.com/noi-techpark/odh-alpinebits-server?tab=readme-ov-file#how-to-request-data"

  - title: "AlpineBits Destination"
    description: "Discover destination data through the AlpineBits DestinationData REST API."
    category: "project_specific"
    buttons:
      - label: "Swagger"
        url: "https://swagger.opendatahub.bz.it/?url=https://destinationdata.alpinebits.opendatahub.bz.it/specification.json"
      - label: "Repository"
        url: "https://github.com/noi-techpark/odh-alpinebits-destination-data-server"

  - title: "GTFS"
    description: "Access a GTFS end-point within the Open Data Hub in some datasets."
    category: "project_specific"
    buttons:
    - label: "Swagger"
      url: "https://swagger.opendatahub.com/?url=https://gtfs.api.opendatahub.com/v1/apispec"
    - label: "Repository"
      url: "https://github.com/noi-techpark/com.opendatahub.api.gtfs"

  - title: "GBFS"
    description: "Retrive a single access point to Open Data Hub GBFS feeds and metadata."
    category: "project_specific"
    buttons:
      - label: "Swagger"
        url: "https://swagger.opendatahub.com/?url=https://gbfs.api.opendatahub.com/v1/apispec"
      - label: "Repository"
        url: "https://github.com/noi-techpark/com.opendatahub.api.gbfs"

